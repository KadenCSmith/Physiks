[package]
name = "cinematic-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "2"
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
trash = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
custom-protocol = ["tauri/custom-protocol"]
